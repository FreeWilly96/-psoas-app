<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Psoas Ultra PRO</title>
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root{
      --bg:#0b1a2f; --panel:rgba(18,27,45,.72); --text:#fff;
      --muted:rgba(255,255,255,.70); --muted2:rgba(255,255,255,.55);
      --strokeBg:rgba(255,255,255,.12); --shadow:0 14px 40px rgba(0,0,0,.35);
      --shadow2:0 8px 18px rgba(0,0,0,.25); --accent1:#a855f7; --accent2:#ec4899;
      --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --btn:#334155; --btn2:#475569;
      --barBg:rgba(15,23,42,.66); --barStroke:rgba(255,255,255,.10); --bottomBarH:335px;
    }
    body.light{
      --bg:#f5f7fb; --panel:rgba(255,255,255,.78); --text:#0b1220;
      --muted:rgba(11,18,32,.70); --muted2:rgba(11,18,32,.55); --strokeBg:rgba(11,18,32,.12);
      --shadow:0 14px 40px rgba(2,8,20,.15); --shadow2:0 8px 18px rgba(2,8,20,.10);
      --btn:#e5e7eb; --btn2:#cbd5e1; --barBg:rgba(255,255,255,.70); --barStroke:rgba(11,18,32,.10);
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{
      margin:0; font-family:Arial,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; text-align:center;
      background:radial-gradient(1200px 800px at 50% -200px,rgba(168,85,247,.35),transparent 60%),
                 radial-gradient(900px 700px at 90% 20%,rgba(236,72,153,.18),transparent 55%),var(--bg);
      color:var(--text); transition:background .3s,color .3s;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow:hidden; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    .app{max-width:860px;margin:0 auto;padding:14px 12px 24px;padding-bottom:calc(var(--bottomBarH) + env(safe-area-inset-bottom));height:calc(100dvh - var(--bottomBarH) - env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none;touch-action:pan-y}
    .app::-webkit-scrollbar{width:0;height:0}
    .topRow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:center;justify-content:center;margin:6px 0 10px}
    .topRow2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:8px 0 0}
    .roundRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin:8px 0 0;align-items:center}
/* iPhone Optimierung */
@media (max-width:520px){

  button{
    min-height:40px !important;
    padding:8px 6px !important;
    border-radius:12px !important;
    font-size:12px !important;
  }

  .bottomBar{
    padding:6px 8px calc(6px + env(safe-area-inset-bottom)) !important;
  }

  .topRow,
  .topRow2,
  .roundRow{
    gap:6px !important;
  }

  :root{
    --bottomBarH:235px;
  }

  .roundDisplay{
    min-height:40px;
    font-size:12px;
  }

  .barSpacer{
    height:2px;
  }

  .app{
    height:calc(100dvh - var(--bottomBarH) - env(safe-area-inset-bottom));
    padding-bottom:calc(var(--bottomBarH) + env(safe-area-inset-bottom));
  }
}
    .card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .headerCard{padding:14px;text-align:left;position:relative}
    #phaseTitle{margin:0;font-size:14px;color:var(--muted2);font-weight:700;letter-spacing:.2px}
    #exerciseTitle{margin:6px 0 0;font-size:clamp(22px,4.2vw,30px);font-weight:900;line-height:1.05;color:var(--text)}
    #setLabel{display:none;margin-top:8px;text-align:left}.badge{display:inline-block;padding:7px 10px;border-radius:999px;font-weight:900;font-size:12.5px;letter-spacing:.4px;color:var(--text);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 22px rgba(0,0,0,.14)}
    .pausedBadge{position:absolute;top:12px;right:12px;padding:8px 10px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:.6px;color:#fff;background:rgba(239,68,68,.86);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 22px rgba(0,0,0,.25);opacity:0;transform:translateY(-6px);pointer-events:none;transition:.18s ease}.pausedBadge.show{opacity:1;transform:translateY(0)}
    .side{font-size:16px;min-height:22px;margin-top:10px;color:var(--muted);font-weight:700;letter-spacing:.2px;text-align:left}
    .imageCard{margin-top:12px;padding:12px 14px}.mediaRow{display:flex;gap:12px;align-items:flex-start}#exerciseImage{width:150px;height:150px;object-fit:contain;border-radius:14px;background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.06);flex:0 0 auto}
    @media(max-width:520px){.mediaRow{flex-direction:column}#exerciseImage{width:100%;height:min(28vh,240px)}}
    .guide{margin:0;padding:0;text-align:left;color:var(--text);font-size:15.5px;line-height:1.35;flex:1 1 auto}.guide ul{margin:0;padding-left:18px}.guide li{margin:6px 0;color:var(--muted)}
    .timerWrap{margin:14px auto 8px;display:flex;align-items:center;justify-content:center}.ring{width:clamp(170px,42vw,220px);height:clamp(170px,42vw,220px);position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 22px rgba(168,85,247,.32)) drop-shadow(0 0 18px rgba(236,72,153,.22))}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring .bg{stroke:var(--strokeBg);stroke-width:12;fill:transparent}.ring .fg{stroke:url(#grad);stroke-width:12;stroke-linecap:round;fill:transparent;filter:url(#glow);transition:stroke-dashoffset .25s linear}.ringNumber{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:clamp(46px,11vw,64px);letter-spacing:.5px;background:linear-gradient(90deg,var(--accent1),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none}
    .ring.pulse{animation:ringPulse 1.15s ease-in-out infinite}.ring.pulseStrong{animation:ringPulseStrong .95s ease-in-out infinite}@keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}@keyframes ringPulseStrong{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
    #progressBar{width:92%;height:10px;background:rgba(255,255,255,.10);margin:10px auto 4px;border-radius:10px;overflow:hidden}#progress{height:100%;width:0%;background:linear-gradient(90deg,var(--accent1),var(--accent2))}
    button{padding:14px 10px;margin:0;border:none;border-radius:18px;color:#fff;font-weight:900;font-size:16px;box-shadow:var(--shadow2);cursor:pointer;min-height:50px;transition:transform .06s,filter .2s,background .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent;user-select:none}button:active{transform:scale(.98)}button:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.15)}.btnActive{box-shadow:0 0 0 2px rgba(168,85,247,.55),var(--shadow2)}
    .start{background:var(--good)}.pause{background:var(--bad)}.continue{background:#e5e7eb;color:#0b1220}body.light .continue{background:#0b1220;color:#fff}.skip{background:var(--warn)}.mode{background:#374151}body.light .mode{background:#94a3b8;color:#0b1220}.stop{background:#0f172a}body.light .stop{background:#111827;color:#fff}.phase{background:var(--btn2);color:#fff}body.light .phase{background:var(--btn);color:#0b1220}.phase.active{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}.roundDisplay{display:flex;align-items:center;justify-content:center;border-radius:18px;min-height:50px;background:rgba(255,255,255,.10);font-weight:900;color:var(--text)}
    .bottomBar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--barBg);border-top:1px solid var(--barStroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:999}.bottomBar .inner{max-width:860px;margin:0 auto}.bottomBar .topRow{margin:0 0 8px}.bottomBar .topRow2{margin:0}.barSpacer{height:8px}
    /* Info Popup */
    .infoOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:none;align-items:flex-end;justify-content:center;padding:18px}
    .infoOverlay.show{display:flex}
    .infoSheet{width:min(860px,100%);max-height:86dvh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:26px 26px 18px 18px;box-shadow:0 22px 70px rgba(0,0,0,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:18px;text-align:left}
    .infoHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
    .infoHead h3{margin:0;font-size:22px;line-height:1.1}.infoHead p{margin:6px 0 0;color:var(--muted);font-weight:700}
    .infoClose{background:rgba(255,255,255,.12);min-height:44px;min-width:44px;border-radius:999px;padding:0}
    .infoGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
    .infoChip{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:12px;text-align:center}
    .infoChip b{display:block;font-size:22px;margin-bottom:3px}.infoChip span{font-size:12px;color:var(--muted);font-weight:800}
    .infoStatus{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:12px;margin:10px 0;color:var(--muted);font-weight:700}
    .infoList{margin:10px 0 0;padding-left:18px;color:var(--muted);line-height:1.45}.infoList li{margin:5px 0}
    .infoActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    @media(max-width:520px){.infoOverlay{padding:0;align-items:flex-end}.infoSheet{border-radius:26px 26px 0 0;max-height:88dvh}.infoGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

  </style>
</head>
<body>
  <div class="app">
    <div class="card headerCard">
      <h2 id="phaseTitle"></h2>
      <h3 id="exerciseTitle"></h3>
      <div id="setLabel"><span class="badge"></span></div>
      <div id="pausedBadge" class="pausedBadge">PAUSIERT</div>
      <div id="side" class="side"></div>
    </div>
    <div class="card imageCard"><div class="mediaRow"><img id="exerciseImage" alt="Übung"><div id="guide" class="guide"></div></div></div>
    <div class="timerWrap"><div id="ring" class="ring" aria-label="Timer"><svg viewBox="0 0 120 120" role="img"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7"></stop><stop offset="100%" stop-color="#ec4899"></stop></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter></defs><circle class="bg" cx="60" cy="60" r="46"></circle><circle id="ringFg" class="fg" cx="60" cy="60" r="46"></circle></svg><div id="timer" class="ringNumber">0</div></div></div>
    <div id="progressBar"><div id="progress"></div></div>
  </div>
  <div class="bottomBar"><div class="inner">
    <div class="topRow"><button id="btnStart" class="start" onclick="start()">Start</button><button id="btnPause" class="pause" onclick="pause()">Pause</button><button id="btnWeiter" class="continue" onclick="weiter()">Weiter</button><button id="btnSkip" class="skip" onclick="skip()">Skip</button><button id="btnMode" class="mode" onclick="toggleMode()">Mode</button></div>
    <div class="topRow2"><button id="btnSingle" class="phase active" onclick="setModule('single')">Eine Runde</button><button id="btnMulti" class="phase" onclick="setModule('multi')">Mehrere Runden</button><button id="btnStretch" class="phase" onclick="setModule('stretch')">Nur Dehnen</button><button id="btnEnd" class="stop" onclick="beenden()">Beenden</button><button id="btnNew" class="mode" onclick="newDailyPreview()">Heute neu</button></div>
    <div class="roundRow"><button id="btnMinus" class="mode" onclick="changeRounds(-1)">− Runde</button><div id="roundDisplay" class="roundDisplay">Runden: 2</div><button id="btnPlus" class="mode" onclick="changeRounds(1)">+ Runde</button><button id="btnInfo" class="mode" onclick="openInfoPopup()">Info</button></div>
    <div class="barSpacer"></div>
  </div></div>


  <div id="infoOverlay" class="infoOverlay" onclick="closeInfoPopup(event)">
    <div class="infoSheet" onclick="event.stopPropagation()">
      <div class="infoHead">
        <div>
          <h3>Trainingsübersicht</h3>
          <p id="infoSubtitle">Live-Status</p>
        </div>
        <button class="infoClose" onclick="closeInfoPopup()">×</button>
      </div>
      <div class="infoGrid">
        <div class="infoChip"><b id="infoWarmup">1</b><span>Warm-up</span></div>
        <div class="infoChip"><b id="infoTraining">5</b><span>Training</span></div>
        <div class="infoChip"><b id="infoStretching">0</b><span>Dehnen</span></div>
        <div class="infoChip"><b id="infoRecovery">1</b><span>Recovery</span></div>
      </div>
      <div id="infoStatus" class="infoStatus"></div>
      <ul id="infoList" class="infoList"></ul>
      <div class="infoActions">
        <button class="mode" onclick="speakWorkoutInfo()">Vorlesen</button>
        <button class="start" onclick="closeInfoPopup(); if(!running) start();">Start</button>
      </div>
    </div>
  </div>

<script>
/* =========================================================
   POOLS: Erwärmen / Training / Dehnen / Erholung
   ========================================================= */
const POOLS = {
  warmup: [
    {name:"Knieheben",subtitle:"Aufwärmen",img:"images/einbeinigesStandknieheben.jpg",type:"sideHoldReps",reps:10,guide:["Aufrecht stehen","Bauchnabel einziehen","Knie abwechselnd kontrolliert heben","Hüfte bleibt stabil"]},
    {name:"Hampelmann",subtitle:"Aufwärmen",img:"images/hampelmann.jpg",type:"time",time:60,guide:["Stelle dich aufrecht hin, Arme am Körper","Springe und öffne gleichzeitig Beine und schließe Arme über den Kopf","Springe zurück, Beine schließen und Arme liegen wieder am Körper"]},
    {name:"High Knees",subtitle:"Aufwärmen",img:"images/hoheknie.jpg",type:"time",time:60,guide:["Laufe auf der Stelle","Ziehe die Knie aktiv nach oben bis auf Hüfthöhe","Arme im Wechsel mitführen"]},
    {name:"Kniebeuge",subtitle:"Aufwärmen",img:"images/kniebeuge.jpg",type:"time",time:60,guide:["Hüftbreit aufstellen","Senke das Gesäß nach hinten und beuge die Knie, gehe so tief wie es gut für dich ist","Rücken bleibt gerade, Knie Richtung Fußspitzen, Gewicht auf den Fersen","Drücke dich über die Fersen wieder nach oben"]},
    {name:"Armkreisen",subtitle:"Aufwärmen",img:"images/armkreisen.jpg",type:"time",time:60,guide:["Locker auf der Stelle gehen","Schultern kreisen mit Richtungswechsel"]}
  ],
  training: [
    {name:"Glute Bridge",subtitle:"Training",img:"images/gluteBridge.jpg",type:"holdReps",reps:15,holdTime:5000,guide:["Rückenlage, Füße hüftbreit aufstellen","Hüfte nach oben drücken, Gesäß anspannen","5 Sekunden halten","Stabil bleiben","Langsam wieder absenken"]},
    {name:"Dynamische Hüftöffnung",subtitle:"Training",img:"images/dynamischeHüftöffnung.jpg",type:"sideHoldReps",reps:10,guide:["Ausfallschritt nach vorne","Hüfte langsam nach vorne schieben","Oberkörper aufrecht, kein Hohlkreuz","Gesäß leicht anspannen, Spannung halten","Bewegung kontrolliert ausführen"]},
    {name:"Glute Bridge einbeinig",subtitle:"Training",img:"images/gluteBridgeeinbeinig.jpg",type:"sideHoldReps",reps:10,guide:["Rückenlage, ein Knie gebeugt, anderes Bein anheben","Hüfte anheben bis der Körper eine Linie bildet","Gesäß anspannen und 4 Sekunden halten","Stabil bleiben","Langsam wieder absenken"]},
    {name:"Dead Bug",subtitle:"Training",img:"images/deadBug.jpg",type:"reps",reps:24,rest:1,guide:["Rückenlage","Arme nach oben und Knie 90 Grad gebeugt","Gleichzeitig ein Bein ausstrecken und den gegenüberliegenden Arm nach hinten führen","Rumpf stabil halten und langsam wieder in die Ausgangsposition","Wechseln ohne das der untere Rücken vom Boden abhebt"]},
    {name:"Seitliche Ausfallschritte",subtitle:"Training",img:"images/seitlicheAusfallschritte.jpg",type:"reps",reps:20,rest:1,guide:["Schritt weit zur Seite machen","Hüfte nach hinten schieben und das Bein beugen","Das andere Bein bleibt gestreckt und locker","Zurück in die Mitte und das Bein wechseln"]},
    {name:"Seitliche Plank kurz",subtitle:"Training",img:"images/seitenplankkurz.jpg",type:"side",time:45,guide:["Lege dich auf die Seite und stütze dich auf deinen Unterarm","Knie leicht angewinkelt","Becken nicht nach vorn oder hinten kippen","Bauch und Gesäß fest anspannen","Halte die Position"]},
    {name:"Seitliche Plank",subtitle:"Training",img:"images/seitenplank.jpg",type:"side",time:45,guide:["Lege dich auf die Seite und stütze dich auf deinen Unterarm","Hebe die Hüfte vom Boden ab, Körper bildet eine Linie","Becken nicht nach vorn oder hinten kippen","Bauch und Gesäß fest anspannen","Halte die Position"]},
    {name:"Plank",subtitle:"Training",img:"images/plank.jpg",type:"time",time:30,guide:["Bauchlage, Ellenbogen unter den Schultern","Füße hüftbreit auseinander","Körper anheben – gerade Linie","Kopf in Verlängerung der Wirbelsäule, Blick nach unten","Bauchnabel einziehen"]},
    {name:"Adduktor Kräftigung",subtitle:"Training",img:"images/adduktorkräftigungsl.jpg",type:"sideHoldReps",reps:10,guide:["Seitlich liegend","Körper bildet eine Linie","Becken nicht nach vorn oder hinten kippen","Stabil bleiben","Bein langsam heben und senken"]},
    {name:"Liegendes Beinheben",subtitle:"Training",img:"images/liegendesBeinheben.jpg",type:"sideHoldReps",reps:12,guide:["Rückenlage","Lendenwirbelsäule bleibt am Boden","Bein langsam heben, kurz halten","Bein langsam wieder absenken aber nicht ablegen"]},
    {name:"Beinkreisen",subtitle:"Training",img:"images/beinkreisen.jpg",type:"side",time:45,guide:["Aufrecht stehen","Bein kontrolliert anheben","Das ausgestreckte Bein kreisen","Werde mit der Bewegung immer größer"]},
    {name:"Bird Dog",subtitle:"Training",img:"images/birddog.jpg",type:"holdReps",reps:8,holdTime:3500,guide:["Vierfüßerstand einnehmen","Hände sind unter den Schultern","Arm und das gegensätzliche Bein diagonal strecken","Halte die Position kurz, Rücken bleibt gerade","Zurück in die Mitte und Seite wechseln"]},
    {name:"Bizeps Curls",subtitle:"Training",img:"images/bizepsmitFlaschen.jpg",type:"reps",reps:15,rest:1,guide:["Aufrecht stehen, in jeder Hand eine Flasche oder Hantel","Beuge die Ellenbogen und führe das Gewicht nach oben","Senke sie kontrolliert wieder ab"]},
    {name:"Liegestütz leicht",subtitle:"Training",img:"images/liegestützleicht.jpg",type:"reps",reps:10,rest:1,guide:["Gehe in die Liegestützposition mit den Knien am Boden","Hände etwas breiter als Schulterbreit aufsetzen","Beuge die Ellenbogen und senke den Oberkörper ab","Drücke dich wieder nach oben"]},
    {name:"Mountain Climber",subtitle:"Training",img:"images/mountainclimber.jpg",type:"time",time:45,guide:["Gehe in die Liegestützposition","Ziehe abwechselnd die Knie schnell in Richtung Brust","Halte den Rücken gerade und den Bauch angespannt"]},
    {name:"Rückenstrecker",subtitle:"Training",img:"images/rückenstrecker.jpg",type:"holdReps",reps:15,holdTime:5000,guide:["Lege dich auf den Bauch, Hände neben den Kopf","Hebe den Oberkörper leicht vom Boden ab","Halte kurz und senke kontrolliert wieder ab"]},
    {name:"Rudern",subtitle:"Training",img:"images/rudern.jpg",type:"reps",reps:15,guide:["Aufrecht stehen, in jeder Hand eine Flasche oder Hantel","Beuge den Oberkörper leicht nach vorne","Ziehe die Gewichte entlang deines Körpers nach oben","Senke die Gewichte kontrolliert wieder ab"]},
    {name:"Russian Twist",subtitle:"Training",img:"images/russianTwist.jpg",type:"sideHoldReps",reps:20,guide:["Setze dich hin, Beine angewinkelt","Oberkörper leicht nach hinten lehnen, Hände vor der Brust halten","Bauch anspannen, den Oberkörper abwechselnd nach rechts und links drehen"]},
    {name:"Situps gerade Bauchmuskulatur",subtitle:"Training",img:"images/situpsgeradeBM.jpg",type:"reps",reps:30,guide:["Lege dich auf den Rücken, Knie angewinkelt","Hände an den Kopf oder vor die Brust","Spanne den Bauch an und hebe den Oberkörper nach oben","Senke den Oberkörper kontrolliert ab"]},
    {name:"Situps seitliche Bauchmuskulatur",subtitle:"Training",img:"images/situpsseitlicheBM.jpg",type:"sideHoldReps",reps:30,guide:["Lege dich auf den Rücken, Knie angewinkelt, Hände an den Kopf","Hebe den Oberkörper an, so dass die Schultern den Boden nicht berühren","Drehe den Oberkörper zur Seite und führe den Ellenbogen zum gegenüberliegenden Knie","Zurück zur Mitte, und Seitenwechsel"]},
    {name:"Superman",subtitle:"Training",img:"images/superman.jpg",type:"holdReps",reps:15,holdTime:5000,guide:["Lege dich auf den Bauch, Arme nach vorne strecken","Hebe gleichzeitig Arme, Brust und Beine vom Boden ab","Spanne den Bauch und das Gesäß an","Halte die Position kurz und senke dich wieder ab"]},
    {name:"Trizeps Dips",subtitle:"Training",img:"images/Trizepsamstuhl.jpg",type:"reps",reps:10,guide:["Setze dich auf die Kante eines stabilen Stuhls","Hände neben die Hüfte auf die Stuhlfläche setzen","Ellenbogen nach hinten beugen und den Körper absenken","Drücke dich wieder nach oben"]},
    {name:"Wadenheben",subtitle:"Training",img:"images/wadenheben.jpg",type:"reps",reps:15,guide:["Stelle dich hüftbreit hin, halte dich an einem Stuhl fest","Hebe die Fersen und gehe auf die Zehenspitzen","Senke die Fersen langsam wieder ab"]},
    {name:"Wandsitz",subtitle:"Training",img:"images/wandsitz.jpg",type:"time",time:60,guide:["Stelle dich mit dem Rücken an eine Wand","Gehe in die Sitzposition, Knie etwa 90 Grad","Halte die Position"]}

/* =========================================================
   DAILY WORKOUT GENERATOR
   ========================================================= */
function dateKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function seedFromString(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seededRandom(seed){let s=seed>>>0;return function(){s+=0x6D2B79F5;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function shuffled(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function take(pool,count,rnd,category,round){const s=shuffled(pool,rnd);return s.slice(0,Math.min(count,s.length)).map(x=>Object.assign({},x,{category:category,round:round||1}))}
function generateDailyWorkout(){
  const rnd=seededRandom(
    seedFromString(
      dateKey()+"-psoas-ultra-pro-"+App.module+"-"+App.rounds
    )
  );

  if(App.module==="stretch"){
    return take(
      POOLS.stretching,
      Math.min(5, POOLS.stretching.length),
      rnd,
      "Dehnen",
      1
    );
  }

  const rounds=getTotalRounds();
  const workout=[];

  // Genau 1 Warm-up, immer nur ganz am Anfang.
  workout.push(...take(
    POOLS.warmup,
    1,
    rnd,
    "Erwärmen",
    1
  ));

  // Pro Runde maximal 5 Trainingsübungen.
  for(let r=1;r<=rounds;r++){
    workout.push(...take(
      POOLS.training,
      5,
      rnd,
      "Training",
      r
    ));
  }

  // Danach maximal 5 Dehnübungen.
  workout.push(...take(
    POOLS.stretching,
    Math.min(5, POOLS.stretching.length),
    rnd,
    "Dehnen",
    rounds
  ));

  // Genau 1 Recovery-Übung.
  workout.push(...take(
    POOLS.recovery,
    1,
    rnd,
    "Erholung",
    rounds
  ));

  return workout;
}
function resetWorkoutForToday(){App.currentWorkout=generateDailyWorkout();current=0;App.currentRound=1;load()}
function newDailyPreview(){haptic(12);if(running)return;resetWorkoutForToday();openInfoPopup()}

/* =========================================================
   SPEECH
   ========================================================= */
let Speech={chain:Promise.resolve(),lastText:"",lastAt:0};
function speak(text,opts){
  if(!text) return Promise.resolve();
  const o=Object.assign({interrupt:true,dedupeMs:250},opts||{});
  const now=Date.now();
  if(text===Speech.lastText && (now-Speech.lastAt)<o.dedupeMs) return Promise.resolve();
  Speech.lastText=text; Speech.lastAt=now;
  if(o.interrupt){try{speechSynthesis.cancel()}catch(e){} Speech.chain=Promise.resolve()}
  Speech.chain=Speech.chain.then(()=>new Promise(resolve=>{
    let done=false; const finish=()=>{if(done)return;done=true;setTimeout(resolve,100)};
    const msg=new SpeechSynthesisUtterance(String(text)); msg.lang="de-DE"; msg.rate=.92; msg.pitch=1; msg.volume=1;
    msg.onend=finish; msg.onerror=finish;
    try{speechSynthesis.speak(msg)}catch(e){finish()}
    setTimeout(finish, Math.max(1800, String(text).length*95));
  }));
  return Speech.chain;
}

function setRing(total,value){total=Number(total)||0;value=Number(value);App.ringTotal=total;App.ringValue=value;const r=46,c=2*Math.PI*r;ringFg.style.strokeDasharray=`${c} ${c}`;if(!total||isNaN(value)){ringFg.style.strokeDashoffset=`${c}`;return}const clamped=Math.max(0,Math.min(total,value));ringFg.style.strokeDashoffset=`${c*(clamped/total)}`}
function resetRing(){setRingPulse('off');App.ringTotal=0;App.ringValue=0;const r=46,c=2*Math.PI*r;ringFg.style.strokeDasharray=`${c} ${c}`;ringFg.style.strokeDashoffset=`${c}`}
function setRingPulse(mode){if(!ringEl)return;ringEl.classList.remove('pulse','pulseStrong');if(mode==='pulse')ringEl.classList.add('pulse');if(mode==='strong')ringEl.classList.add('pulseStrong')}
function update(v){timerEl.innerText=v;const n=Number(v);if(!isNaN(n)&&App.ringTotal)setRing(App.ringTotal,n)}
function showSetLabel(text){if(!setLabelWrap||!setLabelBadge)return;if(text){setLabelBadge.innerText=text;setLabelWrap.style.display='block'}else{setLabelWrap.style.display='none';setLabelBadge.innerText=''}}
function showSide(s){const text=(s||"").toString();if(!text){side.innerText="";showSetLabel("");return}const m=text.match(/Satz\s*(\d+)\s*\/\s*(\d+)/i);if(m){showSetLabel(`Satz ${m[1]}/${m[2]}`);let rest=text.replace(m[0],"").replace(/\(\s*\)/g,"").replace(/\s*·\s*/g," · ").replace(/\s{2,}/g," ").replace(/^\s*·\s*/g,"").replace(/\s*·\s*$/g,"").trim();side.innerText=rest}else{showSetLabel("");side.innerText=text}}
function updateProgress(){const total=App.currentWorkout.length;progress.style.width=total?Math.min(100,(current/total)*100)+"%":"0%"}
function updateButtonStates(){const isRunning=running,isPaused=App.paused;if(btnStart)btnStart.disabled=isRunning;if(btnPause)btnPause.disabled=!isRunning||isPaused;if(btnWeiter)btnWeiter.disabled=!isRunning||!isPaused;if(btnSkip)btnSkip.disabled=!isRunning;if(btnSingle)btnSingle.disabled=isRunning;if(btnMulti)btnMulti.disabled=isRunning;if(btnStretch)btnStretch.disabled=isRunning;if(btnMinus)btnMinus.disabled=isRunning||App.module!=="multi";if(btnPlus)btnPlus.disabled=isRunning||App.module!=="multi";if(btnMode)btnMode.disabled=false;if(btnEnd)btnEnd.disabled=false;if(btnPause)btnPause.classList.toggle('btnActive',isRunning&&isPaused);if(btnWeiter)btnWeiter.classList.toggle('btnActive',isRunning&&isPaused);if(btnStart)btnStart.classList.toggle('btnActive',!isRunning);if(btnSingle)btnSingle.classList.toggle('active',App.module==='single');if(btnMulti)btnMulti.classList.toggle('active',App.module==='multi');if(btnStretch)btnStretch.classList.toggle('active',App.module==='stretch');if(pausedBadge)pausedBadge.classList.toggle('show',isRunning&&isPaused);roundDisplay.innerText=App.module==='stretch'?"Nur Dehnen":`Runden: ${getTotalRounds()}`}

function setModule(m){haptic(12);if(running)return;App.module=m;App.currentRound=1;current=0;resetWorkoutForToday();updateButtonStates()}

function countByCategory(cat){return App.currentWorkout.filter(x=>x.category===cat).length}

function renderInfoPopup(){

  infoStatus.innerHTML=`<b>Live:</b> ${running?"Training läuft":"Bereit"} · Übung ${Math.min(current+1,total)} von ${total}${ex?` · ${ex.name}`:""}`;

  infoList.innerHTML=rules.map(r=>`<li>${r}</li>`).join("");
}
function openInfoPopup(){haptic(10);renderInfoPopup();infoOverlay.classList.add("show")}
function closeInfoPopup(ev){if(ev&&ev.target!==infoOverlay)return;infoOverlay.classList.remove("show")}
function speakWorkoutInfo(){

    ? `Nur Dehnen: ${App.currentWorkout.length} Dehnübungen.`
    : `Heutiges Training: eine Aufwärmübung, maximal fünf Trainingsübungen pro Runde, danach Dehnen und eine Recovery Übung. Insgesamt ${App.currentWorkout.length} Übungen.`;
  speak(txt,{interrupt:true});
}

/* =========================================================
   LOAD
   ========================================================= */
function load(){
  if(!App.currentWorkout.length) App.currentWorkout=generateDailyWorkout();
  const ex=App.currentWorkout[current];
  if(!ex){console.error("Keine Übung gefunden");return}
  const totalRounds=getTotalRounds();
  App.currentRound=ex.round||1;
  const modeText=App.module==='stretch'?'Nur Dehnen':(App.module==='multi'?'Mehrere Runden':'Eine Runde');
  const roundText=App.module==='multi' && ex.category==='Training'?` · Runde ${App.currentRound}/${totalRounds}`:'';
  phaseTitle.innerText=`${dateKey()} · ${modeText}${roundText} · ${ex.category||ex.subtitle||''}`;
  exerciseTitle.innerText=ex.name;
  exerciseImage.onerror=function(){this.onerror=null;this.src="images/fallback.jpg"};
  exerciseImage.src=ex.img||"images/fallback.jpg";
  guide.innerHTML=Array.isArray(ex.guide)?"<ul>"+ex.guide.map(g=>`<li>${g}</li>`).join("")+"</ul>":"";
  const base=ex.time||ex.reps||0;showSide("");update(base);setRingPulse('off');setRing(base,base);updateProgress();updateButtonStates();if(infoOverlay&&infoOverlay.classList.contains("show"))renderInfoPopup();
}

/* =========================================================
   CONTROL FLOW
   ========================================================= */
async function countdown(sec){setRingPulse('off');setRing(sec,sec);for(let i=sec;i>0;i--){if(!running)return;while(App.paused)await sleep(150);update(i);setRing(sec,i);await speak(i.toString(),{interrupt:false})}}
function stopSpeechHard(){
  try{speechSynthesis.cancel()}catch(e){}
  try{
    Speech.chain=Promise.resolve();
    Speech.lastText="";
    Speech.lastAt=0;
  }catch(e){}
}

function clearRuntimeVisuals(){
  showSide("");
  setRingPulse('off');
  if(pausedBadge) pausedBadge.classList.remove('show');
  updateButtonStates();
}

function cancelRun(){
  App.token++;
  running=false;
  App.paused=false;
  stopSpeechHard();
  clearRuntimeVisuals();
}

async function start(){
  haptic(12); if(running) return;
  if(!App.currentWorkout.length) App.currentWorkout=generateDailyWorkout();
  const ex=App.currentWorkout[current]; if(!ex){resetWorkoutForToday();return}
  running=true; App.paused=false; App.state="running"; const myToken=++App.token; updateButtonStates(); load();
  await speak(ex.name); if(myToken!==App.token)return;
  if(ex.subtitle) await speak(ex.subtitle); if(myToken!==App.token)return;
  if(ex.guide){for(const g of ex.guide){while(App.paused)await sleep(150);await speak(g);if(myToken!==App.token)return}}
  await sleep(500); if(myToken!==App.token)return; await speak("Bereit machen"); if(myToken!==App.token)return; await countdown(3); if(myToken!==App.token)return; run(ex,myToken);
}
function run(ex,myToken){switch(ex.type){case"time":runTime(ex,myToken);break;case"reps":runReps(ex,myToken);break;case"side":runSide(ex,myToken);break;case"holdReps":runHoldReps(ex,myToken);break;case"sideHoldReps":runSideHoldReps(ex,myToken);break;case"sideReps":runSideReps(ex,myToken);break;default:console.error("Unbekannter Typ:",ex.type);next()}}

async function finishTraining(){
  running=false;
  App.paused=false;
  App.state="idle";
  current=App.currentWorkout.length;
  updateProgress();
  update("FERTIG");
  resetRing();
  showSide("");
  updateButtonStates();
  renderInfoPopup();
  await speak("Training beendet",{interrupt:true});
  updateButtonStates();
}

async function next(){
  const myToken=App.token;
  running=false;
  App.paused=false;
  current++;

  if(current>=App.currentWorkout.length){
    await finishTraining();
    return;
  }

  load();
  updateButtonStates();
  await sleep(900);

  if(myToken!==App.token) return;
  if(App.paused) return;
  if(current>=App.currentWorkout.length) return;

  start();
}

async function skip(){
  haptic(14);
  if(!running) return;

  App.token++;
  const myToken=App.token;
  running=false;
  App.paused=false;
  stopSpeechHard();
  showSide("");
  setRingPulse('off');

  current++;

  if(current>=App.currentWorkout.length){
    await finishTraining();
    return;
  }

  load();
  updateButtonStates();
  await sleep(250);

  if(myToken!==App.token) return;
  if(App.paused) return;

  start();
}

function pause(){
  haptic(10);
  if(!running) return;
  App.paused=true;
  stopSpeechHard();
  updateButtonStates();
}

function weiter(){
  haptic(10);
  if(!running) return;
  App.paused=false;
  try{speechSynthesis.resume()}catch(e){}
  updateButtonStates();
}

async function beenden(){
  haptic(18);
  cancelRun();
  App.state="idle";
  App.currentRound=1;
  current=0;

  showSide("");
  update("0");
  resetRing();
  progress.style.width="0%";
  load();
  updateButtonStates();

  if(App.speakOnBeenden){
    await speak("Training beendet",{interrupt:true});
  }
  updateButtonStates();
}

/* =========================================================
   RUN TYPES
   ========================================================= */
async function setPauseCountdown(sec,labelText){const myToken=App.token,total=sec;if(labelText)showSide(labelText);const speakFrom=Math.max(1,Math.min(Number(App.setCountdownSeconds)||3,sec));let announced=false;for(let k=sec;k>0;k--){if(!running||myToken!==App.token)return;while(App.paused)await sleep(150);update(k);setRing(total,k);if(App.speakSetCountdown&&k<=speakFrom){if(App.announceNextSet&&!announced&&k===speakFrom){await speak("Nächster Satz in",{interrupt:false,dedupeMs:50});announced=true}await speak(k.toString(),{interrupt:false,dedupeMs:50})}await sleep(1000)}}
async function runTime(ex,myToken){setRingPulse('off');const total=ex.time;let t=total;update(t);setRing(total,t);while(t>0){if(!running||myToken!==App.token)return;while(App.paused){await sleep(150);if(!running||myToken!==App.token)return}if(t<=5)await speak(t.toString(),{interrupt:false,dedupeMs:50});await sleep(1000);if(!running||myToken!==App.token)return;t--;update(t);setRing(total,t)}if(myToken===App.token)next()}

async function runSideHoldReps(ex,myToken){
  const sets=getSets(ex);
  const setPause=getSetPause(ex);
  const sides=["rechts","links"];

  for(let s=1;s<=sets;s++){
    for(let i=0;i<sides.length;i++){
      const sideName=sides[i];

      if(!running||myToken!==App.token)return;

      showSide(`Seite ${sideName} · Satz ${s}/${sets}`);
      await speak("Seite "+sideName,{interrupt:false});

      let reps=ex.reps;
      const total=ex.reps||0;

      setRingPulse('strong');

      while(reps>0&&running){
        if(myToken!==App.token)return;
        if(App.paused){await sleep(150);continue;}

        update(reps);
        setRing(total,reps);
        await speak("Halten",{interrupt:false});
        await sleep(ex.holdTime||4000);
        reps--;
      }

      setRingPulse('off');

      if(i<sides.length-1){
        if(App.speakSideSwitch){
          await speak("Seitenwechsel",{interrupt:false});
        }

        showSide("Wechsel...");
        for(let k=5;k>0;k--){
          if(!running||myToken!==App.token)return;
          while(App.paused)await sleep(150);
          update(k);
          setRing(5,k);
          await sleep(1000);
        }
      }
    }

    if(s<sets&&setPause>0){
      await setPauseCountdown(setPause,`Pause · Satz ${s+1}/${sets}`);
    }
  }

  showSide("");
  setRingPulse('off');
  if(myToken===App.token)next();
}
